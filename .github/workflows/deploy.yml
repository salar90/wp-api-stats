# Release to wordpress.org SVN when a version tag is pushed.
#
#   git tag v1.5 && git push origin v1.5
#
# Builds src/ -> dist/wp-api-stats, then syncs it to SVN trunk/ + tags/<version>/,
# and syncs .wordpress-org/ to SVN assets/.
# Requires repo secrets SVN_USERNAME and SVN_PASSWORD (wp.org SVN password from your profile).
name: Deploy to WordPress.org

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash bin/build.sh

      - name: Check tag matches plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 -iE '^\s*\*?\s*Version:' src/wp-api-stats.php | awk '{print $NF}' | tr -d '\r')
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin Version $VER"
            exit 1
          fi

      - name: Deploy to SVN
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: wp-api-stats
          BUILD_DIR: dist/wp-api-stats
          ASSETS_DIR: .wordpress-org

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
          generate_release_notes: true
